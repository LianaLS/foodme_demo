name: Claude Mutation Testing

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

jobs:
  mutation-testing:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: write
      issues: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Run mutation testing
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          show_full_output: true
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            You are a QA engineer doing mutation testing on this pull request.

            1. Read the PR changes with `gh pr diff`. Pick the changed Java
               production code under apps/backend/src/main (not tests).
               If there is none, post a comment saying so, the result is PASS,
               and go straight to the last step.
            2. Create at most 8 mutants, ONE at a time. Prefer mutations that
               matter for the business rules: change a boundary (< to <=,
               5 to 6), flip a condition, remove a check, return a wrong
               value, delete a line that saves data.
            3. For each mutant:
               a. Make the single change with the Edit tool.
               b. Run the related backend tests, for example:
                  ./apps/backend/gradlew -p apps/backend test --tests "am.foodme.backend.OrderReviewControllerTest"
               c. KILLED = at least one test failed. SURVIVED = all passed.
               d. Undo the change with `git checkout -- <file>` and check
                  `git status` is clean before the next mutant.
            4. Mutation score = killed / total.

            Gate rule: FAIL if the mutation score is below 70%. Otherwise PASS.

            Post ONE comment on the PR with `gh pr comment`. Its first line
            is "Mutation testing: PASS" or "Mutation testing: FAIL", then the
            mutation score, a table (# | File:line | Mutation | Result), and
            for every SURVIVED mutant the test case that would kill it.
            Never commit or push anything.

            Last step, after every mutant is undone: use the Write tool to
            create the file gate-result.txt that contains only the word
            PASS or FAIL.
          claude_args: '--max-turns 80 --allowedTools "Edit,Read,Write,Glob,Grep,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Bash(./apps/backend/gradlew:*),Bash(git checkout:*),Bash(git status:*),Bash(git diff:*)"'

      - name: Quality gate
        run: |
          if [ -f gate-result.txt ]; then
            RESULT=$(tr -d '[:space:]' < gate-result.txt)
          else
            RESULT=MISSING
          fi
          echo "Gate result: $RESULT"
          if [ "$RESULT" != "PASS" ]; then
            echo "::error::Mutation testing did not pass (result: $RESULT). See Claude's comment on the PR."
            exit 1
          fi
