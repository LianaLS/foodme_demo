name: Claude Mutation Testing

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

jobs:
  mutation-testing:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: write
      issues: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Run mutation testing
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            You are a QA engineer doing mutation testing on this pull request.

            1. Read the PR changes with `gh pr diff`. Pick the changed Java
               production code under apps/backend/src/main (not tests).
               If there is none, post a comment saying so and stop.
            2. Create at most 8 mutants, ONE at a time. Prefer mutations that
               matter for the business rules: change a boundary (< to <=,
               5 to 6), flip a condition, remove a check, return a wrong
               value, delete a line that saves data.
            3. For each mutant:
               a. Make the single change with the Edit tool.
               b. Run the related backend tests, for example:
                  ./apps/backend/gradlew -p apps/backend test --tests "am.foodme.backend.OrderReviewControllerTest"
               c. KILLED = at least one test failed. SURVIVED = all passed.
               d. Undo the change with `git checkout -- <file>` and check
                  `git status` is clean before the next mutant.
            4. Mutation score = killed / total.

            Post ONE comment on the PR with `gh pr comment` containing:
            the mutation score, a table (# | File:line | Mutation | Result),
            and for every SURVIVED mutant the test case that would kill it.
            Never commit or push anything.
          claude_args: '--max-turns 80 --allowedTools "Edit,Read,Glob,Grep,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Bash(./apps/backend/gradlew:*),Bash(git checkout:*),Bash(git status:*),Bash(git diff:*)"'
